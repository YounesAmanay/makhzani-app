name: makhzani_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # HTTP client for API calls
  http: ^1.1.0

  # HTTP client for file downloads
  dio: ^5.4.0

  # Local storage and path utilities
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  path: ^1.8.3

  # Secure storage for tokens
  shared_preferences: ^2.2.2

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^12.1.3

  # UI components
  cupertino_icons: ^1.0.8

  # JSON serialization
  json_annotation: ^4.8.1
  share_plus: ^12.0.1
  url_launcher: ^6.3.2

  # Permissions for file downloads
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
