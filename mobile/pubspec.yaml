name: mobile
description: "Makhzani - Smart Inventory Management for Small Sellers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Localization
  intl: 0.20.2

  # Network
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # JSON Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Dependency Injection
  get_it: ^7.7.0
  injectable: ^2.4.4

  # UI Components
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Forms & Validation
  mask_text_input_formatter: ^2.9.0

  # Device Features
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  path_provider: ^2.1.4

  # PDF
  open_file: ^3.3.2

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  logger: ^2.4.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  riverpod_generator: ^2.4.3
  injectable_generator: ^2.6.2
  go_router_builder: ^2.7.1

flutter:
  generate: true
  uses-material-design: true

  # Assets will be added later
  # assets:
  #   - assets/images/
  #   - assets/icons/
